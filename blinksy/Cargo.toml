[package]
name = "blinksy"
version = "0.11.0"
edition = "2021"
rust-version.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# radium 0.7 is a dependency of the latest released version of bitvec which breaks on esp32. So using an unreleased
# version for now. See https://github.com/ferrilab/ferrilab/issues/1#issuecomment-4243321551
bitvec = { git = "https://github.com/ferrilab/ferrilab.git", rev = "6af4ab0a33233573326f4b27f0193a2c956aada5", default-features = false }
defmt = { version = "0.3.10", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }
fugit = "0.3.7"
glam = { version = "0.30.1", default-features = false, features = ["libm"] }
heapless = "0.9.1"
noise-functions = { version = "0.8", default-features = false, features = ["libm"] }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
pastey = "0.2.3"
smart-leds-trait = "0.3.1"

[features]
default = []
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt"]

[package.metadata.docs.rs]
features = ["async"]
