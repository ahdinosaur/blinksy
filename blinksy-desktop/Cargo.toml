[package]
name = "blinksy-desktop"
version = "0.11.0"
edition = "2021"

rust-version.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["blinksy"]
categories = ["multimedia", "rendering"]

[dependencies]
blinksy = { path = "../blinksy", version = "0.11" }
button-driver = { version = "0.2.5", features = ["std"] }
egui = "0.28"
egui-miniquad = "0.15.0"
glam = { version = "0.30.1" }
heapless = "0.9.1"
miniquad = "0.4"
embassy-time = { version = "0.5.1", optional = true, features = ["std"] }

[dev-dependencies]
rand = "0.10.2"

[features]
async = ["blinksy/async", "dep:embassy-time", "button-driver/embassy"]
